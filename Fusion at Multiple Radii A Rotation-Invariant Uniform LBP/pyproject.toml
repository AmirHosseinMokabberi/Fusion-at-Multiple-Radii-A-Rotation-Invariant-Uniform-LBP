[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mrflbp"
version = "1.0.0"
description = "Multi-Radius Fused rotation-invariant uniform LBP for finger-vein identification"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "AmirHossein Mokabberi" },
    { name = "Önsen Toygar" },
]
keywords = [
    "finger vein recognition",
    "biometrics",
    "local binary patterns",
    "feature extraction",
    "dimensionality reduction",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python>=4.6",
    "scikit-image>=0.19",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Paper = "https://doi.org/10.1007/s11760-025-05009-3"

[project.scripts]
mrflbp = "mrflbp.cli:main"

[tool.setuptools]
packages = ["mrflbp"]
